<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Crop Recommender — Read the soil. Pick the crop.</title>
  <desc id="desc">A Jupyter notebook that merges two crop datasets, explores soil and climate features and compares ten scikit-learn classifiers to recommend a crop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#14261a"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#a3e635"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#a3e635" opacity=".04"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23.0" font-weight="700">Crop<tspan fill="#a3e635"> Recommender</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54.0" font-weight="750" letter-spacing="-2">Read the soil.</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54.0" font-weight="750" letter-spacing="-2">Pick the crop.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18.0">Ten scikit-learn classifiers compared on soil nutrients and climate readings.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#a3e635"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">soil / model</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14.0">
      <text x="862" y="138" fill="#a3e635">N, P, K, pH<tspan fill="#94a3b8"> → features</tspan></text>
      <text x="862" y="166" fill="#4ade80">climate<tspan fill="#94a3b8"> → features</tspan></text>
      <text x="862" y="194" fill="#facc15">Naive Bayes<tspan fill="#94a3b8"> → 92.5% test</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/>
      <rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/>
      <rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#a3e635" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / MERGE</text>
      <text x="352" y="309">02 / EXPLORE</text>
      <text x="628" y="309">03 / COMPARE</text>
      <text x="904" y="309">04 / PREDICT</text>
    </g>
    <text x="76" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Combine two datasets</text>
    <text x="76" y="367" fill="#94a3b8" font-size="13.0">3,996 rows, deduplicated</text>
    <text x="352" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Check distributions</text>
    <text x="352" y="367" fill="#94a3b8" font-size="13.0">Histograms, z-scores, IQR</text>
    <text x="628" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Train ten classifiers</text>
    <text x="628" y="367" fill="#94a3b8" font-size="13.0">Logistic to gradient boosting</text>
    <text x="904" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Recommend a crop</text>
    <text x="904" y="367" fill="#94a3b8" font-size="13.0">Naive Bayes + SVM</text>
    <text x="56" y="428" fill="#64748b" font-size="13">Python · pandas · scikit-learn · seaborn · Matplotlib · SciPy · Jupyter</text>
  </g>
</svg>
